<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>제주 감귤체험 | 제주아꼼이네</title>
<link rel="icon" href="https://akkome.com/web/upload/favicon-3ad34130ee1b4111ba23d0eb68849bce.ico">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--yellow:#F5C800;--navy:#1B3A6B;--red:#FF3B30;--green:#00A651;--white:#fff;--text-dark:#1A1A1A;--text-mid:#888;--radius:15px;--bottom-h:72px;--header-h:52px;--action-h:64px}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',sans-serif;color:var(--text-dark);background:var(--white);max-width:480px;margin:0 auto;padding-top:var(--header-h);padding-bottom:calc(var(--bottom-h) + var(--action-h));-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
button,select{font-family:inherit}

/* 헤더 */
.pd-header{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:480px;margin:0 auto}
.pd-header a{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--navy)}
.pd-header .pd-title{font-size:14px;font-weight:700;color:var(--navy);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 히어로 이미지 */
.hero-img{width:100%;aspect-ratio:4/3;background:#f8f8f8;overflow:hidden}
.hero-img img{width:100%;height:100%;object-fit:cover}

/* 체험 안내 섹션 */
.exp-info{padding:24px 16px;text-align:center;border-bottom:8px solid #f5f5f5}
.exp-info h1{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:900;color:var(--navy);margin-bottom:8px}
.exp-info .desc{font-size:14px;color:var(--text-mid);line-height:1.6;margin-bottom:14px}
.exp-badge{display:inline-block;font-size:13px;font-weight:700;padding:6px 16px;border-radius:20px;background:var(--yellow);color:var(--navy)}

/* 포토 그리드 */
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px;border-bottom:8px solid #f5f5f5}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}

/* 특징 */
.exp-features{padding:16px;border-bottom:8px solid #f5f5f5}
.feature-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid #f5f5f5}
.feature-item:last-child{border:none}
.feature-icon{font-size:24px;flex-shrink:0;width:36px;text-align:center}
.feature-text .ft-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:4px}
.feature-text .ft-desc{font-size:12px;color:var(--text-mid);line-height:1.5}

/* 정보 카드 */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px;border-bottom:8px solid #f5f5f5}
.info-card{padding:16px;border-radius:12px;background:#f8f8f8;text-align:center}
.info-card.highlight{background:var(--yellow)}
.info-card .ic-icon{font-size:20px;margin-bottom:6px}
.info-card .ic-label{font-size:11px;color:var(--text-mid);margin-bottom:4px}
.info-card.highlight .ic-label{color:var(--navy)}
.info-card .ic-value{font-size:13px;font-weight:700;color:var(--navy)}

/* 하단 고정 액션 */
.pd-action{position:fixed;bottom:var(--bottom-h);left:0;right:0;z-index:100;background:#fff;height:var(--action-h);display:flex;align-items:center;gap:10px;padding:0 16px;border-top:1px solid #eee;max-width:480px;margin:0 auto}
.btn-call{flex:1;height:44px;border-radius:10px;border:1.5px solid #fff;background:transparent;color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center}
.btn-map{flex:1;height:44px;border-radius:10px;border:none;background:var(--yellow);color:var(--navy);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center}
.pd-action{background:var(--navy)}
.btn-call{border-color:rgba(255,255,255,.5);color:#fff}
.btn-call:active{background:rgba(255,255,255,.1)}
.btn-map:active{background:#E8B800}

/* 하단 네비 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;height:var(--bottom-h);display:flex;align-items:center;justify-content:space-around;border-top:1px solid #e8e8e8;max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#aaa;font-weight:500;padding:8px 10px;min-width:52px}
.bnav-item svg{width:24px;height:24px;stroke:#aaa;fill:none;stroke-width:1.8}
.bnav-item.active{color:var(--navy);font-weight:700}
.bnav-item.active svg{stroke:var(--yellow)}

@media(min-width:768px){body,.pd-header,.pd-action,.bottom-nav{max-width:480px;left:50%;right:auto;transform:translateX(-50%)}}
</style>
</head>
