<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>감귤체험 예약 | 제주아꼼이네</title>
<link rel="icon" href="https://akkome.com/web/upload/favicon-3ad34130ee1b4111ba23d0eb68849bce.ico">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Montserrat:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--yellow:#F5C800;--navy:#1B3A6B;--red:#FF3B30;--green:#00A651;--white:#fff;--text-dark:#1A1A1A;--text-mid:#888;--radius:15px;--bottom-h:72px;--header-h:52px;--action-h:64px}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',sans-serif;color:var(--text-dark);background:var(--white);max-width:480px;margin:0 auto;padding-top:var(--header-h);padding-bottom:calc(var(--bottom-h) + var(--action-h));-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit}
/* Font Rules */
h1{font-family:'Black Han Sans',sans-serif}
h2,h3{font-family:'Noto Sans KR',sans-serif;font-weight:700}
.subtitle,.en-text{font-family:'Montserrat',sans-serif;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
.pd-discount,.pd-sale,.pd-org,.pd-total,.prod-sale-price,.prod-discount,.prod-org-price{font-family:'Montserrat',sans-serif}
img{max-width:100%;display:block}
button,select{font-family:'Noto Sans KR',sans-serif;font-weight:700}

/* 헤더 */
.pd-header{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:480px;margin:0 auto}
.pd-header a{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--navy)}
.pd-header .pd-logo-link{display:inline-flex;width:auto;gap:6px;flex:1;justify-content:flex-start}
.pd-header .pd-title{font-size:14px;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 히어로 */
.hero-img{width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:0}
.hero-img img{width:100%;height:100%;object-fit:cover}

/* 체험 소개 */
.exp-intro{padding:20px 16px}
.exp-intro h1{font-family:'Black Han Sans',sans-serif;font-size:20px;font-weight:900;color:var(--navy)}
.season-badge{display:inline-block;background:#FFF3CD;color:#856404;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;margin:10px 0 16px}
.feature-list{display:flex;flex-direction:column;gap:8px}
.feature-item{display:flex;flex-direction:row;gap:10px;padding:12px;background:#F8F8F8;border-radius:12px;align-items:center}
.feature-icon{width:36px;height:36px;min-width:36px;background:#FFFBEA;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
.feature-text .ft-title{font-size:13px;font-weight:700;color:var(--text-dark)}
.feature-text .ft-desc{font-size:11px;color:var(--text-mid);margin-top:2px}

/* 갤러리 */
.gallery{padding:0 16px 20px}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gallery-grid .gal-item{border-radius:12px;overflow:hidden;aspect-ratio:1}
.gallery-grid .gal-item img{width:100%;height:100%;object-fit:cover}

/* 예약 안내 */
.reservation{background:var(--navy);padding:24px 16px;color:#fff}
.reservation h2{font-family:'Noto Sans KR',sans-serif;font-size:18px;font-weight:900;color:var(--yellow);margin-bottom:14px}
.res-row{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.1)}
.res-row:last-child{border-bottom:none}
.res-row .rl{color:rgba(255,255,255,0.6)}
.res-row .rv{color:#fff;font-weight:500}

/* 하단 고정 액션 */
.pd-action{position:fixed;bottom:var(--bottom-h);left:0;right:0;z-index:100;background:#fff;height:var(--action-h);display:flex;align-items:center;gap:10px;padding:0 16px;border-top:1px solid #eee;max-width:480px;margin:0 auto}
.btn-call{flex:1;height:44px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.btn-call:active{background:#f5f5f5}
.btn-map{flex:2;height:44px;border-radius:10px;border:none;background:var(--yellow);color:var(--navy);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.btn-map:active{background:#E8B800}

/* 하단 네비 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;height:var(--bottom-h);display:flex;align-items:center;justify-content:space-around;border-top:1px solid #e8e8e8;max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#aaa;font-weight:500;padding:8px 10px;min-width:52px}
.bnav-item svg{width:24px;height:24px;stroke:#aaa;fill:none;stroke-width:1.8}
.bnav-item.active{color:var(--navy);font-weight:700}
.bnav-item.active svg{stroke:var(--yellow)}

@media(min-width:768px){body,.pd-header,.pd-action,.bottom-nav{max-width:480px;left:50%;right:auto;transform:translateX(-50%)}}
</style>
</head>
