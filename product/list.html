<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>전체상품 | 제주아꼼이네</title>
<link rel="icon" href="https://akkome.com/web/upload/favicon-3ad34130ee1b4111ba23d0eb68849bce.ico">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Montserrat:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--yellow:#F5C800;--navy:#1B3A6B;--red:#FF3B30;--green:#00A651;--white:#fff;--text-dark:#1A1A1A;--text-mid:#888;--radius:15px;--bottom-h:72px;--header-h:52px}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',sans-serif;color:var(--text-dark);background:var(--white);max-width:480px;margin:0 auto;padding-top:calc(var(--header-h) + 48px);padding-bottom:var(--bottom-h);-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit}
/* Font Rules */
h1{font-family:'Black Han Sans',sans-serif}
h2,h3{font-family:'Noto Sans KR',sans-serif;font-weight:700}
.subtitle,.en-text{font-family:'Montserrat',sans-serif;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
.pd-discount,.pd-sale,.pd-org,.pd-total,.prod-sale-price,.prod-discount,.prod-org-price{font-family:'Montserrat',sans-serif}
img{max-width:100%;display:block}
button,select{font-family:'Noto Sans KR',sans-serif;font-weight:700}

/* 헤더 */
.pd-header{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:480px;margin:0 auto}
.pd-header a{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--navy)}
.pd-header .pd-logo-link{display:inline-flex;width:auto;gap:6px;flex:1;justify-content:flex-start}
.pd-header .pd-title{font-size:14px;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 필터 탭 */
.filter-tabs{position:fixed;top:var(--header-h);left:0;right:0;z-index:99;background:#fff;padding:12px 16px;display:flex;gap:6px;overflow-x:auto;max-width:480px;margin:0 auto;border-bottom:1px solid #f0f0f0}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid #eee;background:#fff;color:#888;flex-shrink:0}
.filter-tab.active{background:var(--navy);color:#fff;border:1px solid var(--navy)}

/* 상품 그리드 */
.product-grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product-card{background:#fff;border:1px solid #eee;border-radius:15px;position:relative;overflow:hidden}
.product-card.sold-out{opacity:0.5}
.product-card a{display:block;text-decoration:none;color:inherit}
.product-card .card-img{width:100%;aspect-ratio:1;overflow:hidden}
.product-card .card-img img{width:100%;height:100%;object-fit:cover}
.product-card .card-info{padding:10px}
.card-desc{font-size:10px;color:#888;margin-bottom:2px}
.card-name{font-size:13px;font-weight:700;color:var(--text-dark);margin-bottom:4px}
.card-price-row{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.card-disc{font-size:15px;font-weight:900;color:var(--red)}
.card-price{font-size:15px;font-weight:700;color:var(--text-dark)}
.card-org{font-size:11px;color:#888;text-decoration:line-through}
.card-ship{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:#E8F5E9;color:var(--green)}

/* 뱃지 - 상품 */
.product-badge{position:absolute;top:8px;left:8px;z-index:2;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;color:#fff}

/* 하단 네비 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;height:var(--bottom-h);display:flex;align-items:center;justify-content:space-around;border-top:1px solid #e8e8e8;max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#aaa;font-weight:500;padding:8px 10px;min-width:52px}
.bnav-item svg{width:24px;height:24px;stroke:#aaa;fill:none;stroke-width:1.8}
.bnav-item.active{color:var(--navy);font-weight:700}
.bnav-item.active svg{stroke:var(--yellow)}

@media(min-width:768px){body,.pd-header,.filter-tabs,.bottom-nav{max-width:480px;left:50%;right:auto;transform:translateX(-50%)}}
</style>
</head>

<script>
var ALL_PRODUCTS = [
  {name:'제주 한라봉',desc:'진한 향과 달콤함',price:'24,000',org:'',disc:'',badge:'',img:'../images/썸네일/한라봉/2-1썸네일.jpg',link:'hanrabong.html',soldOut:false,cat:'mangam'},
  {name:'제주 천혜향',desc:'과즙 터지는 달콤함',price:'32,500',org:'',disc:'',badge:'지금절정',img:'../images/썸네일/천혜향/2-1썸네일.jpg',link:'cheonhyehyang.html',soldOut:false,cat:'mangam'},
  {name:'제주 레몬',desc:'제주산 싱그러운 레몬',price:'33,000',org:'',disc:'',badge:'',img:'../images/썸네일/레몬/2-1썸네일.jpg',link:'lemon.html',soldOut:false,cat:'etc'},
  {name:'제주 블러드오렌지',desc:'새콤달콤 블러드오렌지',price:'34,800',org:'',disc:'',badge:'',img:'../images/썸네일/블러드오렌지/2-1썸네일.jpg',link:'blood-orange.html',soldOut:false,cat:'mangam'},
  {name:'제주 수라향',desc:'입안에서 살살 녹는 식감',price:'42,800',org:'',disc:'',badge:'프리미엄',img:'../images/썸네일/수라향/2-1썸네일.jpg',link:'surahyang.html',soldOut:false,cat:'mangam'},
  {name:'제주 카라향',desc:'진짜 맛있는 만감류',price:'28,800',org:'',disc:'',badge:'',img:'../images/썸네일/카라향/2-1썸네일.jpg',link:'karahyang.html',soldOut:false,cat:'mangam'},
  {name:'제주 자몽',desc:'새콤달콤 과육이 살아있어요',price:'34,800',org:'',disc:'',badge:'',img:'../images/썸네일/자몽/2-1썸네일.jpg',link:'jagong.html',soldOut:false,cat:'etc'},
  {name:'제주 하귤',desc:'청 담가먹기에 딱 좋아요',price:'24,800',org:'',disc:'',badge:'',img:'../images/썸네일/하귤/2-1썸네일.jpg',link:'hagyul.html',soldOut:false,cat:'etc'},
  {name:'제주 비가림 감귤',desc:'고당도 믿고 먹는 맛',price:'32,800',org:'',disc:'',badge:'',img:'../images/썸네일/비가림귤/2-1썸네일.jpg',link:'gamgyul.html',soldOut:true,cat:'gamgyul'},
  {name:'제주 타이벡 감귤',desc:'달콤 끝판왕',price:'26,900',org:'',disc:'',badge:'',img:'../images/썸네일/타이벡귤/2-1썸네일.jpg',link:'taibek.html',soldOut:true,cat:'gamgyul'},
  {name:'제주 하우스 감귤',desc:'하우스 재배 고당도',price:'32,800',org:'',disc:'',badge:'',img:'../images/썸네일/하우스귤/2-1썸네일.jpg',link:'housegamgyul.html',soldOut:true,cat:'gamgyul'},
  {name:'제주 노지 감귤',desc:'제주 노지에서 자란 감귤',price:'20,500',org:'',disc:'',badge:'',img:'../images/썸네일/노지귤/2썸네일.jpg',link:'noji.html',soldOut:true,cat:'gamgyul'},
  {name:'제주 레드향',desc:'달콤하고 향긋한 레드향',price:'35,800',org:'',disc:'',badge:'',img:'../images/썸네일/레드향/2-1썸네일.jpg',link:'redhyang.html',soldOut:true,cat:'mangam'},
  {name:'제주 황금향',desc:'황금빛 달콤한 황금향',price:'32,800',org:'',disc:'',badge:'',img:'../images/썸네일/황금향/2-1썸네일.jpg',link:'hwanggumhyang.html',soldOut:true,cat:'mangam'},
  {name:'제주 산하홍',desc:'붉은 빛깔 달콤한 산하홍',price:'38,800',org:'',disc:'',badge:'',img:'../images/썸네일/산하홍/2-1썸네일.jpg',link:'sanhahong.html',soldOut:true,cat:'mangam'},
  {name:'제주 세미놀귤',desc:'희귀한 제주 세미놀귤',price:'35,800',org:'',disc:'',badge:'',img:'../images/썸네일/세미놀귤/2-1썸네일.jpg',link:'seminol.html',soldOut:true,cat:'mangam'},
  {name:'제주 유라조생',desc:'조생 품종 달콤한 감귤',price:'28,800',org:'',disc:'',badge:'',img:'../images/썸네일/유라조생/2-1썸네일.jpg',link:'yurajosaeng.html',soldOut:true,cat:'gamgyul'},
  {name:'제주 청귤',desc:'청귤 특유의 상큼함',price:'19,800',org:'',disc:'',badge:'',img:'../images/썸네일/청귤/2-1썸네일.jpg',link:'cheonggul.html',soldOut:true,cat:'gamgyul'},
  {name:'제주 초당옥수수',desc:'달콤한 초당옥수수',price:'29,800',org:'',disc:'',badge:'',img:'../images/썸네일/초당옥수수/2-1썸네일.jpg',link:'corn.html',soldOut:true,cat:'etc'},
  {name:'제주 고깔양배추',desc:'아삭한 고깔양배추',price:'18,800',org:'',disc:'',badge:'',img:'../images/썸네일/고깔양배추/2-1썸네일.jpg',link:'cabbage.html',soldOut:true,cat:'etc'},
  {name:'제주 미니밤호박',desc:'달콤한 미니밤호박',price:'24,800',org:'',disc:'',badge:'',img:'../images/썸네일/미니밤호박/2-1썸네일.jpg',link:'minibamhobak.html',soldOut:true,cat:'etc'},
  {name:'제주 브로콜리',desc:'신선한 브로콜리',price:'15,800',org:'',disc:'',badge:'',img:'../images/썸네일/브로콜리/2-1썸네일.jpg',link:'broccoli.html',soldOut:true,cat:'etc'},
  {name:'감귤 체험농장',desc:'11월~1월 시즌 운영',price:'12,000',org:'28,000',disc:'57',badge:'시즌한정',img:'../images/3.체험장/체험장1.jpg',link:'experience.html',soldOut:true,cat:'etc'}
];

function getBadgeColor(badge) {
  if (badge === '지금절정') return '#FF3B30';
  if (badge === '특가') return '#F5C800';
  if (badge === '인기') return '#00A651';
  if (badge === '프리미엄') return '#1B3A6B';
  if (badge === '시즌한정') return '#FF6B00';
  return '#888';
}

function getBadgeTextColor(badge) {
  if (badge === '특가') return '#1B3A6B';
  return '#fff';
}

var currentFilter = 'all';

function renderProducts() {
  var grid = document.getElementById('productGrid');
  var html = '';
  for (var i = 0; i < ALL_PRODUCTS.length; i++) {
    var p = ALL_PRODUCTS[i];
    if (currentFilter !== 'all' && p.cat !== currentFilter) continue;
    var soldClass = p.soldOut ? ' sold-out' : '';
    html += '<div class="product-card' + soldClass + '"><a href="' + p.link + '">';
    if (p.soldOut) {
      html += '<span class="product-badge" style="background:#999;color:#fff">품절</span>';
    } else if (p.badge) {
      html += '<span class="product-badge" style="background:' + getBadgeColor(p.badge) + ';color:' + getBadgeTextColor(p.badge) + '">' + p.badge + '</span>';
    }
    html += '<div class="card-img"><img src="' + p.img + '" alt="' + p.name + '"></div>';
    html += '<div class="card-info">';
    html += '<div class="card-desc">' + p.desc + '</div>';
    html += '<div class="card-name">' + p.name + '</div>';
    html += '<div class="card-price-row">';
    html += '<span class="card-price">' + p.price + '원</span>';
    html += '</div>';
    html += '<span class="card-ship">무료배송</span>';
    html += '</div></a></div>';
  }
  grid.innerHTML = html;
}

// 필터 탭 클릭
var tabs = document.querySelectorAll('.filter-tab');
for (var i = 0; i < tabs.length; i++) {
  tabs[i].addEventListener('click', function() {
    for (var j = 0; j < tabs.length; j++) {
      tabs[j].classList.remove('active');
    }
    this.classList.add('active');
    currentFilter = this.getAttribute('data-filter');
    renderProducts();
  });
}

renderProducts();
</script>
</body>
