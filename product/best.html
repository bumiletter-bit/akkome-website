<style>
:root{--yellow:#F5C800;--navy:#1B3A6B;--red:#FF3B30;--green:#00A651;--white:#fff;--text-dark:#1A1A1A;--text-mid:#888;--radius:15px;--bottom-h:72px;--header-h:52px}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',sans-serif;color:var(--text-dark);background:var(--white);max-width:480px;margin:0 auto;padding-top:var(--header-h);padding-bottom:var(--bottom-h);-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

/* 헤더 */
.pd-header{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:480px;margin:0 auto}
.pd-header a{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--navy)}
.pd-header .pd-title{font-size:14px;font-weight:700;color:var(--navy);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 상품 그리드 */
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 12px}
.product-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #f0f0f0;display:flex;flex-direction:column}
.product-card a{display:flex;flex-direction:column;height:100%}
.card-img{width:100%;aspect-ratio:1;overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;color:#fff}
.card-badge.peak{background:#FF3B30}
.card-badge.popular{background:#00A651}
.card-badge.premium{background:#1B3A6B}
.card-body{padding:10px;flex:1;display:flex;flex-direction:column}
.card-desc{font-size:11px;color:var(--text-mid);margin-bottom:4px}
.card-name{font-size:13px;font-weight:700;color:var(--text-dark);margin-bottom:6px}
.card-price-row{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.card-discount{font-size:14px;font-weight:900;color:var(--red)}
.card-price{font-size:14px;font-weight:900;color:var(--text-dark)}
.card-org{font-size:11px;color:var(--text-mid);text-decoration:line-through}
.card-ship{display:inline-block;font-size:10px;font-weight:600;color:var(--green);background:#E8F5E9;padding:2px 6px;border-radius:4px;margin-top:auto}

/* 하단 네비 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;height:var(--bottom-h);display:flex;align-items:center;justify-content:space-around;border-top:1px solid #e8e8e8;max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#aaa;font-weight:500;padding:8px 10px;min-width:52px}
.bnav-item svg{width:24px;height:24px;stroke:#aaa;fill:none;stroke-width:1.8}
.bnav-item.active{color:var(--navy);font-weight:700}
.bnav-item.active svg{stroke:var(--yellow)}

@media(min-width:768px){body,.pd-header,.bottom-nav{max-width:480px;left:50%;right:auto;transform:translateX(-50%)}}
</style>
</head>
