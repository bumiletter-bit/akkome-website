<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>베스트 ⭐ | 제주아꼼이네</title>
<link rel="icon" href="https://akkome.com/web/upload/favicon-3ad34130ee1b4111ba23d0eb68849bce.ico">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Montserrat:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--yellow:#F5C800;--navy:#1B3A6B;--red:#FF3B30;--green:#00A651;--white:#fff;--text-dark:#1A1A1A;--text-mid:#888;--radius:15px;--bottom-h:72px;--header-h:52px}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',sans-serif;color:var(--text-dark);background:var(--white);max-width:480px;margin:0 auto;padding-top:var(--header-h);padding-bottom:var(--bottom-h);-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit}
/* Font Rules */
h1{font-family:'Black Han Sans',sans-serif}
h2,h3{font-family:'Noto Sans KR',sans-serif;font-weight:700}
.subtitle,.en-text{font-family:'Montserrat',sans-serif;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
.pd-discount,.pd-sale,.pd-org,.pd-total,.prod-sale-price,.prod-discount,.prod-org-price{font-family:'Montserrat',sans-serif}
img{max-width:100%;display:block}
button,select{font-family:'Noto Sans KR',sans-serif;font-weight:700}

/* 헤더 */
.pd-header{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:480px;margin:0 auto}
.pd-header a{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--navy)}
.pd-header .pd-title{font-size:14px;font-weight:700;color:var(--navy);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 상단 */
.top-section{padding:20px 16px;text-align:center}
.top-section h1{font-family:'Black Han Sans',sans-serif;font-size:20px;font-weight:900;color:var(--navy)}

/* 상품 그리드 */
.product-grid{padding:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product-card{background:#fff;border:1px solid #eee;border-radius:15px;position:relative;overflow:hidden}
.product-card a{display:block;text-decoration:none;color:inherit}
.product-card .card-img{width:100%;aspect-ratio:1;overflow:hidden}
.product-card .card-img img{width:100%;height:100%;object-fit:cover}
.product-card .card-info{padding:10px}
.card-desc{font-size:10px;color:#888;margin-bottom:2px}
.card-name{font-size:13px;font-weight:700;color:var(--text-dark);margin-bottom:4px}
.card-price-row{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.card-disc{font-size:15px;font-weight:900;color:var(--red)}
.card-price{font-size:15px;font-weight:700;color:var(--text-dark)}
.card-org{font-size:11px;color:#888;text-decoration:line-through}
.card-ship{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:#E8F5E9;color:var(--green)}

/* 뱃지 - 랭크 */
.rank-badge{position:absolute;top:8px;right:8px;z-index:2;width:28px;height:28px;border-radius:50%;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}
.rank-1{background:#FFD700;color:#333}
.rank-2{background:#C0C0C0;color:#333}
.rank-3{background:#CD7F32;color:#333}
.rank-other{background:#eee;color:#888}

/* 뱃지 - 상품 */
.product-badge{position:absolute;top:8px;left:8px;z-index:2;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;color:#fff}

/* 하단 네비 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;height:var(--bottom-h);display:flex;align-items:center;justify-content:space-around;border-top:1px solid #e8e8e8;max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#aaa;font-weight:500;padding:8px 10px;min-width:52px}
.bnav-item svg{width:24px;height:24px;stroke:#aaa;fill:none;stroke-width:1.8}
.bnav-item.active{color:var(--navy);font-weight:700}
.bnav-item.active svg{stroke:var(--yellow)}

@media(min-width:768px){body,.pd-header,.bottom-nav{max-width:480px;left:50%;right:auto;transform:translateX(-50%)}}
</style>
</head>
<body>

<header class="pd-header">
  <a href="../index.html">←</a>
  <span class="pd-title">베스트 ⭐</span>
  <a href="https://akkome.com/order/cart.html" target="_blank">🛒</a>
</header>

<div class="top-section">
  <img src="../images/제철 아꼼이 추천 pick.png" style="width:60px;height:60px;object-fit:contain;margin:0 auto 8px" alt="아꼼이 추천">
  <h1>아꼼이네 인기 상품 TOP</h1>
</div>

<div class="product-grid" id="bestGrid"></div>

<nav class="bottom-nav">
  <a href="../index.html" class="bnav-item"><svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg><span>홈</span></a>
  <a href="list.html" class="bnav-item active"><svg viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg><span>상품</span></a>
  <a href="experience.html" class="bnav-item"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6 2 10c0 5.25 10 13 10 13s10-7.75 10-13c0-4-4.48-8-10-8z" stroke-linejoin="round"/><path d="M12 6c-1 0-3 1.5-3 4s2 4 3 4 3-1.5 3-4-2-4-3-4z"/></svg><span>체험</span></a>
  <a href="../index.html#reviews" class="bnav-item"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>후기</span></a>
  <a href="https://akkome.com/order/cart.html" target="_blank" class="bnav-item"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg><span>장바구니</span></a>
</nav>

<script>
var BEST_PRODUCTS = [
  {rank:1, name:'제주 꼬마 한라봉',desc:'당도보장 꼬마한라봉',price:'34,800',org:'60,000',disc:'42',badge:'지금절정',img:'../images/2.썸네일/꼬마한라봉.jpg',link:'kkoma-hanrabong.html'},
  {rank:2, name:'제주 천혜향',desc:'과즙 터지는 달콤함',price:'32,500',org:'160,000',disc:'80',badge:'지금절정',img:'../images/2.썸네일/천혜향.jpg',link:'cheonhyehyang.html'},
  {rank:3, name:'제주 비가림 감귤',desc:'고당도 믿고 먹는 맛',price:'32,800',org:'93,800',disc:'65',badge:'인기',img:'../images/2.썸네일/비가림감귤.jpg',link:'gamgyul.html'},
  {rank:4, name:'제주 한라봉',desc:'진한 향과 달콤함',price:'24,000',org:'',disc:'',badge:'',img:'../images/2.썸네일/한라봉.jpg',link:'hanrabong.html'},
  {rank:5, name:'제주 레몬',desc:'제주산 싱그러운 레몬',price:'33,000',org:'',disc:'',badge:'',img:'../images/2.썸네일/레몬.jpg',link:'lemon.html'},
  {rank:6, name:'제주 수라향',desc:'입안에서 살살 녹는 식감',price:'42,800',org:'',disc:'',badge:'프리미엄',img:'../images/2.썸네일/수라향.jpg',link:'surahyang.html'}
];

function getBadgeColor(badge) {
  if (badge === '지금절정') return '#FF3B30';
  if (badge === '인기') return '#00A651';
  if (badge === '프리미엄') return '#1B3A6B';
  return '#888';
}

function getRankClass(rank) {
  if (rank === 1) return 'rank-1';
  if (rank === 2) return 'rank-2';
  if (rank === 3) return 'rank-3';
  return 'rank-other';
}

function renderBest() {
  var grid = document.getElementById('bestGrid');
  var html = '';
  for (var i = 0; i < BEST_PRODUCTS.length; i++) {
    var p = BEST_PRODUCTS[i];
    html += '<div class="product-card"><a href="' + p.link + '">';
    html += '<span class="rank-badge ' + getRankClass(p.rank) + '">' + p.rank + '위</span>';
    if (p.badge) {
      html += '<span class="product-badge" style="background:' + getBadgeColor(p.badge) + '">' + p.badge + '</span>';
    }
    html += '<div class="card-img"><img src="' + p.img + '" alt="' + p.name + '"></div>';
    html += '<div class="card-info">';
    html += '<div class="card-desc">' + p.desc + '</div>';
    html += '<div class="card-name">' + p.name + '</div>';
    html += '<div class="card-price-row">';
    if (p.disc) html += '<span class="card-disc">' + p.disc + '%</span>';
    html += '<span class="card-price">' + p.price + '원</span>';
    html += '</div>';
    if (p.org) html += '<div class="card-org">' + p.org + '원</div>';
    html += '<span class="card-ship">무료배송</span>';
    html += '</div></a></div>';
  }
  grid.innerHTML = html;
}
renderBest();
</script>
</body>
</html>
