<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>혜택 | 제주아꼼이네</title>
<link rel="icon" href="https://akkome.com/web/upload/favicon-3ad34130ee1b4111ba23d0eb68849bce.ico">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Montserrat:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--yellow:#F5C800;--navy:#1B3A6B;--red:#FF3B30;--green:#00A651;--white:#fff;--text-dark:#1A1A1A;--text-mid:#888;--radius:15px;--bottom-h:72px;--header-h:52px}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',sans-serif;color:var(--text-dark);background:var(--white);max-width:480px;margin:0 auto;padding-top:var(--header-h);padding-bottom:var(--bottom-h);-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit}
/* Font Rules */
h1{font-family:'Black Han Sans',sans-serif}
h2,h3{font-family:'Noto Sans KR',sans-serif;font-weight:700}
.subtitle,.en-text{font-family:'Montserrat',sans-serif;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
.pd-discount,.pd-sale,.pd-org,.pd-total,.prod-sale-price,.prod-discount,.prod-org-price{font-family:'Montserrat',sans-serif}
img{max-width:100%;display:block}

/* 헤더 */
.pd-header{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:480px;margin:0 auto}
.pd-header a{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--navy)}
.pd-header .pd-logo-link{display:inline-flex;width:auto;gap:6px;flex:1;justify-content:flex-start}
.pd-header .pd-title{font-size:14px;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 회원가입 혜택 */
.hero-benefit{background:var(--yellow);padding:32px 16px}
.hero-benefit h1{font-family:'Black Han Sans',sans-serif;font-size:22px;font-weight:900;color:var(--navy);text-align:center}
.benefit-list{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.benefit-item{background:#fff;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px}
.benefit-item .b-icon{font-size:28px;flex-shrink:0}
.benefit-item .b-title{font-size:13px;font-weight:700;color:var(--navy)}
.benefit-item .b-desc{font-size:11px;color:#888;margin-top:2px}
.cta-btn{display:block;width:100%;background:var(--navy);color:#fff;font-size:15px;font-weight:700;border:none;border-radius:12px;padding:14px;text-align:center;margin-top:20px;cursor:pointer}
.cta-btn:active{opacity:.9}

/* 쿠폰존 */
.coupon-section{padding:24px 16px;background:#fff}
.coupon-section h2{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:16px}
.coupon-card{border:2px dashed var(--yellow);border-radius:16px;padding:20px;text-align:center}
.coupon-card .amount{font-family:'Montserrat',sans-serif;font-size:32px;font-weight:900;color:var(--red)}
.coupon-card .coupon-name{font-size:13px;color:var(--navy);margin-top:4px}
.coupon-card .coupon-note{font-size:11px;color:#888;margin-top:8px}
.coupon-btn{display:inline-block;background:var(--yellow);color:var(--navy);font-size:13px;font-weight:700;border:none;border-radius:20px;padding:10px 24px;margin-top:12px;cursor:pointer}
.coupon-btn:active{opacity:.9}

/* VIP 혜택 */
.vip-section{padding:24px 16px;background:#F8F8F8}
.vip-section h2{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:16px}
.vip-list{display:flex;flex-direction:column;gap:8px}
.vip-card{background:#fff;border-radius:12px;padding:14px;border-left:3px solid var(--yellow);display:flex;align-items:flex-start;gap:12px}
.vip-card .v-icon{font-size:22px;flex-shrink:0}
.vip-card .v-title{font-size:13px;font-weight:700;color:var(--navy)}
.vip-card .v-desc{font-size:12px;color:#888;margin-top:2px}

/* 하단 네비 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;height:var(--bottom-h);display:flex;align-items:center;justify-content:space-around;border-top:1px solid #e8e8e8;max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#aaa;font-weight:500;padding:8px 10px;min-width:52px}
.bnav-item svg{width:24px;height:24px;stroke:#aaa;fill:none;stroke-width:1.8}
.bnav-item.active{color:var(--navy);font-weight:700}
.bnav-item.active svg{stroke:var(--yellow)}

@media(min-width:768px){body,.pd-header,.bottom-nav{max-width:480px;left:50%;right:auto;transform:translateX(-50%)}}
</style>
</head>
