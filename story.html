<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>아꼼이네 이야기 | 제주아꼼이네</title>
<link rel="icon" href="https://akkome.com/web/upload/favicon-3ad34130ee1b4111ba23d0eb68849bce.ico">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--yellow:#F5C800;--navy:#1B3A6B;--red:#FF3B30;--green:#00A651;--white:#fff;--text-dark:#1A1A1A;--text-mid:#888;--radius:15px;--bottom-h:72px;--header-h:52px}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',sans-serif;color:var(--text-dark);background:var(--white);max-width:480px;margin:0 auto;padding-top:var(--header-h);padding-bottom:var(--bottom-h);-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

/* 헤더 */
.pd-header{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:480px;margin:0 auto}
.pd-header a{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--navy)}
.pd-header .pd-title{font-size:14px;font-weight:700;color:var(--navy);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 히어로 */
.hero-img{width:100%;aspect-ratio:16/9;overflow:hidden}
.hero-img img{width:100%;height:100%;object-fit:cover}

/* 섹션 */
.story-section{padding:28px 16px;border-bottom:8px solid #f5f5f5}
.story-section:last-of-type{border-bottom:none}
.story-section h1{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:900;color:var(--navy);margin-bottom:16px;line-height:1.4}
.story-section p{font-size:14px;color:var(--text-dark);line-height:1.8;margin-bottom:12px}

/* 약속 */
.promise-list{display:flex;flex-direction:column;gap:0}
.promise-item{display:flex;align-items:center;gap:10px;padding:12px 0;font-size:13px;color:var(--text-dark);border-bottom:1px solid #f5f5f5}
.promise-item:last-child{border-bottom:none}
.promise-item span{font-size:18px;flex-shrink:0}

/* 농장 사진 그리드 */
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}

/* 슬로건 */
.slogan{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;color:var(--navy);text-align:center;line-height:1.6}

/* 하단 네비 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;height:var(--bottom-h);display:flex;align-items:center;justify-content:space-around;border-top:1px solid #e8e8e8;max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#aaa;font-weight:500;padding:8px 10px;min-width:52px}
.bnav-item svg{width:24px;height:24px;stroke:#aaa;fill:none;stroke-width:1.8}
.bnav-item.active{color:var(--navy);font-weight:700}
.bnav-item.active svg{stroke:var(--yellow)}

@media(min-width:768px){body,.pd-header,.bottom-nav{max-width:480px;left:50%;right:auto;transform:translateX(-50%)}}
</style>
</head>
<body>

<header class="pd-header">
  <a href="index.html">←</a>
  <span class="pd-title">아꼼이네 이야기</span>
  <a href="https://akkome.com/order/cart.html" target="_blank">🛒</a>
</header>

<div class="hero-img"><img src="images/3.체험장/체험장1.jpg" alt="제주아꼼이네 농장"></div>

<section class="story-section">
  <h1>제주가 키우고, 아꼼이네가 고릅니다.</h1>
  <p>"아꼼이"는 "사랑스럽다"는 제주도 사투리입니다. 정직하고 좋은 제품을 판매하겠다는 마음으로 제 딸 태명을 따와 '제주아꼼이네'로 짓게 되었습니다.</p>
  <p>3대째 농업을 이어온 제주아꼼이네. 가족이 먹는 것처럼 고르고, 가족한테 드리듯 보냅니다.</p>
</section>

<section class="story-section">

  <div class="promise-list">
    <div class="promise-item"><span>✅</span> 당도보장 · 맛없으면 무료반품</div>
    <div class="promise-item"><span>🚚</span> 산지직송 · 전국 무료배송</div>
    <div class="promise-item"><span>⏰</span> 오전 8시 전 주문 당일발송</div>
  </div>
</section>

<section class="story-section">
  <h1>🌿 우리 농장</h1>
  <div class="photo-grid">
    <img src="images/3.체험장/체험장1.jpg" alt="농장 사진 1">
    <img src="images/3.체험장/체험장2.jpg" alt="농장 사진 2">
    <img src="images/3.체험장/체험장3.jpg" alt="농장 사진 3">
    <img src="images/3.체험장/체험장4.jpg" alt="농장 사진 4">
  </div>
</section>

<section class="story-section">
  <p class="slogan">달아야 팝니다. 안 달면 안 팝니다.</p>
</section>
