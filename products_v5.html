<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F5">
<title>제주아꼼이네 — 쇼핑 (v5 실데이터)</title>
<style>
  /* ============================================================
     제주아꼼이네 프로토타입 — products_v5.html (쇼핑 목록, 지시 #117)
     v5 홈과 동일 스킨(라임) · 데이터 = assets/data/store_snapshot_2026-07-30.json (네이버 실측)
     카드 클릭 → index_v5.html#p/{no} (홈 풀스크린 상세로) · 카테고리 필터 실상품 재분류
     ============================================================ */
  :root{
    --primary:#8CC63E; --primary-dark:#5F9E1F; --primary-light:#F1F8E4;
    --violet:#7C3AED; --bg:#F2F3F5; --card:#FFFFFF;
    --text-dark:#15181C; --text-mid:#667085; --text-light:#98A0AE;
    --border:#ECEDF1; --border-soft:#F1F2F5; --yellow:#FFD600;
    --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.06); --tabbar-h:62px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ color-scheme:light only; scrollbar-width:none; }
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
      "Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,Arial,sans-serif;
    background:#E9EAEF; color:var(--text-dark); line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  a{ color:inherit; text-decoration:none; }
  .app{ position:relative; max-width:480px; min-height:100dvh; margin:0 auto; background:var(--bg); box-shadow:0 0 40px rgba(16,24,40,.12); overflow-x:clip; }
  .scroll{ padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 20px); }

  .subhead{
    position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:4px;
    padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;
  }
  .back-btn{ width:38px; height:38px; flex:none; display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:800; border-radius:10px; }
  .back-btn:active{ background:var(--primary-light); color:var(--primary-dark); }
  .subhead h1{ font-size:17px; font-weight:800; letter-spacing:-.02em; }

  /* 카테고리 칩 (필터) */
  .chips{ position:sticky; top:calc(58px + env(safe-area-inset-top,0px)); z-index:19; display:flex; gap:7px; overflow-x:auto; padding:10px 14px; background:#fff; border-bottom:1px solid var(--border-soft); scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:none; font-size:12.5px; font-weight:700; color:var(--text-mid); background:#F2F3F5; padding:8px 14px; border-radius:999px; }
  .chip.on{ background:var(--primary); color:#153015; font-weight:800; }

  .count-row{ padding:12px 16px 0; font-size:12px; font-weight:600; color:var(--text-mid); }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:10px 14px 0; }
  .subhead2{ display:flex; align-items:center; gap:8px; margin:22px 16px 0; font-size:14px; font-weight:800; color:var(--text-mid); }
  .subhead2::after{ content:''; flex:1; height:1px; background:#E7E9EC; }

  .prod{ display:block; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .thumb{ position:relative; height:130px; background:#F2F3F5; }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .flag{ position:absolute; top:8px; left:8px; font-size:10px; font-weight:800; color:#153015; background:var(--primary); padding:3px 8px; border-radius:999px; }
  .flag.red{ background:#F04438; color:#fff; }
  .soldout-tag{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .soldout-tag i{ font-style:normal; font-size:11px; font-weight:800; color:#fff; background:rgba(16,24,40,.62); padding:5px 12px; border-radius:999px; }
  .prod.dead .thumb img{ filter:grayscale(1); opacity:.62; }
  .body{ padding:10px 11px 12px; }
  .name{ font-size:12.5px; font-weight:800; line-height:1.35; letter-spacing:-.02em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:34px; }
  .price{ margin-top:6px; display:flex; align-items:baseline; gap:5px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
  .rate{ font-size:12.5px; font-weight:800; color:#F04438; }
  .now{ font-size:13.5px; font-weight:800; color:#111; }
  .org{ font-size:10.5px; color:var(--text-light); text-decoration:line-through; }
  .meta{ margin-top:4px; font-size:11px; font-weight:700; color:var(--text-mid); }
  .meta .st{ color:#F5A623; }
  .fresh{ display:inline-flex; margin-top:6px; font-size:9.5px; font-weight:800; color:#0B7A3E; background:#E7F6EC; padding:2px 7px; border-radius:999px; }
  .wait-btn{ margin-top:7px; width:100%; font-size:10.5px; font-weight:800; color:var(--primary-dark); border:1.5px solid var(--primary); background:#F6FBEF; padding:7px 0; border-radius:9px; }

  .foot-note{ text-align:center; padding:30px 20px 8px; font-size:11.5px; color:var(--text-light); font-weight:600; }

  .tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; z-index:50;
    background:rgba(255,255,255,.96); backdrop-filter:blur(8px); border-top:1px solid var(--border);
    display:flex; height:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px)); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--text-light); font-size:10.5px; font-weight:700; }
  .tab .t-ic{ font-size:21px; line-height:1; filter:grayscale(1) opacity(.55); padding:2px 12px; border-radius:999px; }
  .tab.active{ color:var(--primary-dark); }
  .tab.active .t-ic{ filter:none; background:var(--primary-light); }

  .cal-modal{ position:fixed; inset:0; background:rgba(16,24,40,.5); z-index:120; display:none; align-items:center; justify-content:center; padding:30px; }
  .cal-modal.show{ display:flex; }
  .cal-modal .cm-box{ background:#fff; border-radius:18px; padding:22px 20px; max-width:300px; text-align:center; }
  .cal-modal .cm-box h4{ font-size:15px; font-weight:800; }
  .cal-modal .cm-box p{ margin-top:7px; font-size:12.5px; color:var(--text-mid); line-height:1.55; }
  .cal-modal .cm-box button{ margin-top:14px; width:100%; background:var(--primary); color:#153015; font-weight:800; font-size:13px; padding:11px 0; border-radius:11px; }
</style>
</head>
<body>
<div class="app">
  <div class="scroll">
    <header class="subhead">
      <a class="back-btn" href="index_v5.html" aria-label="홈으로">‹</a>
      <h1>장보기 · 쇼핑</h1>
    </header>

    <!-- 카테고리 필터 (실상품 20종 재분류 — #117) -->
    <div class="chips" id="chips"></div>
    <div class="count-row" id="countRow">불러오는 중...</div>
    <div class="grid" id="gridLive"></div>
    <div class="subhead2" id="deadHead" hidden>🌙 시즌 준비 중 — 대기 신청하면 오픈 때 알려드려요</div>
    <div class="grid" id="gridDead"></div>

    <div class="foot-note">
      제주 밭에서 우리집 식탁까지, <b>제주아꼼이네</b> 🍊<br>
      (쇼핑 목록 v5 — 네이버 스토어 실데이터 스냅샷 2026-07-30 · 실제 서비스 아님)
    </div>
  </div>

  <nav class="tabbar" aria-label="하단 메뉴">
    <a class="tab" href="index_v5.html"><span class="t-ic">🏠</span>홈</a>
    <a class="tab active" href="index_v5.html#c/citrus"><span class="t-ic">🛒</span>쇼핑</a>
    <a class="tab" href="my.html"><span class="t-ic">🌳</span>귤나무 키우기</a>
    <a class="tab" href="my.html#orders"><span class="t-ic">📦</span>주문내역</a>
    <a class="tab" href="my.html"><span class="t-ic">👤</span>마이</a>
  </nav>
</div>

<script>
(function(){
"use strict";
/* 카테고리 재분류 — 실상품 20종 기준 (#117). cat 키는 홈 카테고리 아이콘과 공유 */
var CATS = [
  { key:'all',      name:'전체' },
  { key:'citrus',   name:'감귤류' },
  { key:'veg',      name:'채소·호박' },
  { key:'preorder', name:'사전예약' },
  { key:'gift',     name:'선물세트' },
  { key:'sale',     name:'특가할인' }
];
var CAT_OF = {   /* 채널상품번호 → 카테고리 (감귤류=만감류 포함·sale은 할인율로 동적) */
  '6400134206':'citrus','11126666859':'citrus','4840212264':'citrus','5128078653':'citrus','4787044506':'citrus',
  '8302986279':'citrus','8528902063':'citrus','5531798664':'citrus','4773814370':'citrus','6445171353':'citrus',
  '13175235737':'citrus','12957301776':'citrus','7673020911':'citrus',
  '5011476022':'veg','13392734089':'veg','11928134543':'veg','11928081841':'veg','6766868273':'veg',
  '5731582511':'preorder','10801253976':'gift'
};
var SHORT = {'5011476022':'미니밤호박 (특품·못난이·꼬마)','6400134206':'고당도 하우스감귤 · 황금향','5731582511':'제주 청귤(풋귤)','11126666859':'제주 황금향 (가정용·선물용)','10801253976':'혼합 과일 선물세트','13392734089':'생취나물 부지갱이','13175235737':'제주 자몽','12957301776':'만감류 대용량 (레드향·한라봉 外)','11928134543':'제주 고깔양배추','11928081841':'제주 햇 브로콜리','8528902063':'제주 하귤','8302986279':'제주 카라향','7673020911':'감귤밭 체험 (귤따기·시식)','6766868273':'초당옥수수','6445171353':'블러드 오렌지','5531798664':'제주 레몬','5128078653':'제주 천혜향','4840212264':'제주 한라봉','4787044506':'제주 레드향','4773814370':'제주 홍귤(산하홍)'};
var FLAGS = {'6400134206':'베스트','5731582511':'사전예약특가','5011476022':'특품','11126666859':'과즙팡팡','10801253976':'선물추천'};

var D = null, cat = 'all';
var F = function(n){ return (n==null?0:n).toLocaleString('ko-KR'); };
function range(it){
  if(!it.opts || !it.opts.length) return { min: it.discPrice, max: it.discPrice };
  var ds = it.opts.map(function(o){ return o.price||0; });
  return { min: it.discPrice + Math.min.apply(null, ds), max: it.discPrice + Math.max.apply(null, ds) };
}
function priceLabel(it){ var r=range(it); return r.min===r.max ? F(r.min)+'원' : F(r.min)+'~'+F(r.max)+'원'; }
function freshLabel(){
  var d=new Date(); d.setDate(d.getDate()+1);
  if(d.getDay()===6) d.setDate(d.getDate()+1);
  var yo=['일','월','화','수','목','금','토'][d.getDay()];
  var tomorrow=(d.getTime()-Date.now())<36*3600*1000;
  return '오늘 주문 → '+(tomorrow?'내일':yo+'요일')+'('+yo+') 발송';
}
var FRESH = freshLabel();
function inCat(it){
  if(cat==='all') return true;
  if(cat==='sale') return (it.discRate||0) >= 45 && !it.soldout;   /* 특가 = 할인율 45%↑ 판매중 */
  return CAT_OF[String(it.no)]===cat;
}
function card(it, dead){
  var flag = dead?'' : (FLAGS[String(it.no)]?'<span class="flag'+(FLAGS[String(it.no)]==='사전예약특가'?' red':'')+'">'+FLAGS[String(it.no)]+'</span>':'');
  return '<a class="prod'+(dead?' dead':'')+'" href="index_v5.html#p/'+it.no+'">'+
    '<span class="thumb"><img loading="lazy" src="'+it.img+'" alt="">'+flag+(dead?'<span class="soldout-tag"><i>시즌 준비 중</i></span>':'')+'</span>'+
    '<span class="body"><span class="name">'+(SHORT[String(it.no)]||it.name)+'</span>'+
    '<span class="price">'+(dead?'':'<span class="rate">'+it.discRate+'%</span>')+'<span class="now">'+priceLabel(it)+'</span>'+(dead?'':'<span class="org">'+F(it.salePrice)+'원</span>')+'</span>'+
    '<span class="meta"><span class="st">★</span>'+it.score+' · 리뷰 '+F(it.reviewCount)+'</span>'+
    (dead?'<button class="wait-btn" type="button" data-wait>🔔 시즌 대기 신청</button>':'<span class="fresh">🚚 '+FRESH+'</span>')+
    '</span></a>';
}
function render(){
  document.getElementById('chips').innerHTML = CATS.map(function(c){
    return '<button class="chip'+(c.key===cat?' on':'')+'" data-cat="'+c.key+'">'+c.name+'</button>';
  }).join('');
  var items = D.items.filter(inCat);
  var live = items.filter(function(i){return !i.soldout;}).sort(function(a,b){return b.reviewCount-a.reviewCount;});
  var dead = items.filter(function(i){return i.soldout;}).sort(function(a,b){return b.reviewCount-a.reviewCount;});
  document.getElementById('countRow').textContent = CATS.find(function(c){return c.key===cat;}).name+' — 판매중 '+live.length+' · 시즌 준비 중 '+dead.length;
  document.getElementById('gridLive').innerHTML = live.map(function(i){return card(i,false);}).join('');
  document.getElementById('gridDead').innerHTML = dead.map(function(i){return card(i,true);}).join('');
  document.getElementById('deadHead').hidden = !dead.length;
}
document.getElementById('chips').addEventListener('click', function(e){
  var b = e.target.closest('[data-cat]');
  if(!b) return;
  cat = b.dataset.cat;
  history.replaceState(null,'','?cat='+cat);
  render();
});
var modal = document.createElement('div');
modal.className='cal-modal'; modal.innerHTML='<div class="cm-box"><h4>🔔 시즌 대기 신청</h4><p>실서비스 오픈 준비 중이에요!<br>시즌이 열리면 알림톡으로 알려드릴 예정입니다 🍊</p><button type="button" data-close>알겠어요!</button></div>';
document.body.appendChild(modal);
modal.addEventListener('click', function(e){ if(e.target===modal||e.target.closest('[data-close]')) modal.classList.remove('show'); });
document.addEventListener('click', function(e){
  var w=e.target.closest('[data-wait]');
  if(w){ e.preventDefault(); e.stopPropagation(); modal.classList.add('show'); }
}, true);

var q = new URLSearchParams(location.search).get('cat');
if(q && CATS.some(function(c){return c.key===q;})) cat = q;
fetch('assets/data/store_snapshot_2026-07-30.json')
  .then(function(r){ return r.json(); })
  .then(function(d){ D=d; render(); })
  .catch(function(){ document.getElementById('countRow').textContent='데이터를 불러오지 못했습니다 — http 서버로 열어주세요 (프로토타입은 스냅샷 fetch 사용)'; });
})();
</script>
</body>
</html>
